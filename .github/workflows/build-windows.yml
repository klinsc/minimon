name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Build minimon-win-x64.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name minimon-win-x64
          --hidden-import minimon_core
          minimon-win.pyw

      - name: Smoke-check the exe exists
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: minimon-win-x64
          path: dist/minimon-win-x64.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/minimon-win-x64.exe
